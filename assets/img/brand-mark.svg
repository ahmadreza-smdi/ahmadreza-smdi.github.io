<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 96 96" role="img" aria-labelledby="title desc">
    <title id="title">Ahmadreza Samadi AS monogram</title>
    <desc id="desc">A rich blue and cyan abstract monogram combining the letters A and S.</desc>
    <defs>
        <linearGradient id="surface" x1="10" y1="6" x2="86" y2="90">
            <stop offset="0" stop-color="#0b2a55" />
            <stop offset="0.5" stop-color="#030a12" />
            <stop offset="1" stop-color="#041a36" />
        </linearGradient>
        <linearGradient id="edge" x1="16" y1="8" x2="86" y2="86">
            <stop offset="0" stop-color="#f7fdff" />
            <stop offset="0.38" stop-color="#7beeff" />
            <stop offset="0.68" stop-color="#085cff" />
            <stop offset="1" stop-color="#07182a" />
        </linearGradient>
        <linearGradient id="aStroke" x1="27" y1="73" x2="70" y2="22">
            <stop offset="0" stop-color="#085cff" />
            <stop offset="0.48" stop-color="#c7f5ff" />
            <stop offset="1" stop-color="#2ecbff" />
        </linearGradient>
        <linearGradient id="sStroke" x1="68" y1="24" x2="28" y2="74">
            <stop offset="0" stop-color="#ffffff" />
            <stop offset="0.42" stop-color="#5ce2ff" />
            <stop offset="1" stop-color="#085cff" />
        </linearGradient>
        <filter id="cyanGlow" x="-35%" y="-35%" width="170%" height="170%">
            <feGaussianBlur stdDeviation="1.5" result="blur" />
            <feColorMatrix in="blur" type="matrix" values="0 0 0 0 0.18 0 0 0 0 0.68 0 0 0 0 1 0 0 0 0.24 0" />
            <feMerge>
                <feMergeNode />
                <feMergeNode in="SourceGraphic" />
            </feMerge>
        </filter>
    </defs>
    <rect width="96" height="96" rx="22" fill="#020812" />
    <rect x="7" y="7" width="82" height="82" rx="20" fill="url(#surface)" stroke="url(#edge)" stroke-width="2.2" />
    <path d="M27 70 L48 25 L69 70" fill="none" stroke="url(#aStroke)" stroke-width="5.4" stroke-linecap="round" stroke-linejoin="round" filter="url(#cyanGlow)" />
    <path d="M37 55 H59" fill="none" stroke="#f7fdff" stroke-width="4.2" stroke-linecap="round" opacity="0.86" />
    <path d="M65 31 C57 23 39 26 38 40 C37 51 58 47 59 58 C60 72 39 75 30 64" fill="none" stroke="url(#sStroke)" stroke-width="4.4" stroke-linecap="round" stroke-linejoin="round" filter="url(#cyanGlow)" />
    <path d="M21 78 H75" fill="none" stroke="#f7fdff" stroke-opacity="0.16" stroke-width="1.3" stroke-linecap="round" />
</svg>
