<text x="600" y="550" font-family="Vazirmatn, Tahoma, Arial, sans-serif" font-size="80" font-weight="600" fill="#0E2A33" text-anchor="middle" direction="rtl">مؤشر الإيجار</text>
<rect x="70" y="650" width="1060" height="230" rx="22" fill="#E3EDE8" stroke="#0B6A7A" stroke-width="2"/>
<text x="600" y="735" font-family="Vazirmatn, Tahoma, Arial, sans-serif" font-size="80" font-weight="600" fill="#0E2A33" text-anchor="middle" direction="rtl">عقار محدد؟</text>
<text x="600" y="840" font-family="Vazirmatn, Tahoma, Arial, sans-serif" font-size="80" font-weight="600" fill="#0E2A33" text-anchor="middle" direction="rtl">خدمة التقييم</text>
<rect x="70" y="940" width="1060" height="230" rx="22" fill="#D7EAF4" stroke="#0B6A7A" stroke-width="2"/>
