<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="1280" viewBox="0 0 1200 1280" role="img" aria-labelledby="title desc" xml:lang="en">
<title id="title">Original decision diagram</title><desc id="desc">Four questions, four source purposes. Check dates, coverage and terms before using the answer.</desc>
<rect width="1200" height="1280" rx="32" fill="#F2F7F5"/>
<rect x="70" y="70" width="1060" height="230" rx="22" fill="#BDE7D2" stroke="#0B6A7A" stroke-width="2"/>
<text x="600" y="155" font-family="Sora, Arial, sans-serif" font-size="80" font-weight="600" fill="#0E2A33" text-anchor="middle" direction="ltr">Market trend?</text>
<text x="600" y="260" font-family="Sora, Arial, sans-serif" font-size="80" font-weight="600" fill="#0E2A33" text-anchor="middle" direction="ltr">Sales index</text>
<rect x="70" y="360" width="1060" height="230" rx="22" fill="#C3DCF4" stroke="#0B6A7A" stroke-width="2"/>
<text x="600" y="445" font-family="Sora, Arial, sans-serif" font-size="80" font-weight="600" fill="#0E2A33" text-anchor="middle" direction="ltr">Rent benchmark?</text>
<text x="600" y="550" font-family="Sora, Arial, sans-serif" font-size="80" font-weight="600" fill="#0E2A33" text-anchor="middle" direction="ltr">Rental index</text>
<rect x="70" y="650" width="1060" height="230" rx="22" fill="#E3EDE8" stroke="#0B6A7A" stroke-width="2"/>
<text x="600" y="735" font-family="Sora, Arial, sans-serif" font-size="80" font-weight="600" fill="#0E2A33" text-anchor="middle" direction="ltr">One property?</text>
<text x="600" y="840" font-family="Sora, Arial, sans-serif" font-size="80" font-weight="600" fill="#0E2A33" text-anchor="middle" direction="ltr">Valuation service</text>
<rect x="70" y="940" width="1060" height="230" rx="22" fill="#D7EAF4" stroke="#0B6A7A" stroke-width="2"/>
<text x="600" y="1025" font-family="Sora, Arial, sans-serif" font-size="80" font-weight="600" fill="#0E2A33" text-anchor="middle" direction="ltr">Purchase costs?</text>
<text x="600" y="1130" font-family="Sora, Arial, sans-serif" font-size="80" font-weight="600" fill="#0E2A33" text-anchor="middle" direction="ltr">Service fee pages</text>
