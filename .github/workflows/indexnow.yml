name: Notify IndexNow after Pages deployment

on:
  push:
    branches: [main]

permissions:
  contents: read
  deployments: read

jobs:
  notify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Verify canonical URL mapping
        run: PYTHONDONTWRITEBYTECODE=1 python3 scripts/test_notify_indexnow.py
      - name: Verify SEO language, canonical and author metadata
        run: PYTHONDONTWRITEBYTECODE=1 python3 scripts/check_locale_parity.py
      - name: Verify internal page and fragment links
        run: |
          PYTHONDONTWRITEBYTECODE=1 python3 scripts/test_check_internal_links.py
          PYTHONDONTWRITEBYTECODE=1 python3 scripts/check_internal_links.py
      - name: Verify current work and speaking locale pages
        run: PYTHONDONTWRITEBYTECODE=1 python3 scripts/build_status_pages.py --check
      - name: Verify public homepage passage export
        run: PYTHONDONTWRITEBYTECODE=1 python3 scripts/build_ask_index.py --check
      - name: Notify changed canonical pages after successful Pages deployment
        env:
          BEFORE_SHA: ${{ github.event.before }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python3 scripts/notify_indexnow.py --before "$BEFORE_SHA" --after "$GITHUB_SHA" --wait-for-pages
