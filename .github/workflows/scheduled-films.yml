name: Scheduled daily films

on:
  schedule:
    # 21:00 Tehran, with two bounded retries. The manifest enforces exact 2026 dates.
    - cron: '30,40,50 17 23-27 10 *'
  workflow_dispatch:
    inputs:
      mode:
        description: Verify private prepared bundles or publish only an actually due film
        type: choice
        options: [verify, verify-deployment, publish-due]
        default: verify

permissions:
  contents: write
  pages: write

concurrency:
  group: reviewed-daily-film-publication
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      GH_TOKEN: ${{ github.token }}
      PYTHONDONTWRITEBYTECODE: '1'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: main
          fetch-depth: 0
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: '3.13'
      - name: Test date, duplicate and bundle guards
        run: python3 -B -m unittest discover -s scripts/online_films -p 'test_*.py' -v
      - name: Rehearse all private bundles and verify Pages access
        if: github.event_name == 'workflow_dispatch' && inputs.mode == 'verify'
        run: python3 -B scripts/online_films/publish.py --verify --verify-build
      - name: Verify existing Pages deployment only
        if: github.event_name == 'workflow_dispatch' && inputs.mode == 'verify-deployment'
        run: python3 -B scripts/online_films/publish.py --verify-build
      - name: Publish only the reviewed film due now
        if: github.event_name == 'schedule' || inputs.mode == 'publish-due'
        run: python3 -B scripts/online_films/publish.py
