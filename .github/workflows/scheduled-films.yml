name: Scheduled daily films

on:
  schedule:
    # Start cloud workers before the slot; runner waits for21:00Tehran.
    # Off-peak retries retain strict dates,30minwindow and duplicate guards.
    - cron: '17,37,57 14-17 25-27 10 *'
    # Bounded 28 October–2 November extension: privately prewarm each
    # 10:00 carousel and21:00 film, with off-peak prewarm retries and a
    # bounded in-window retry. One concurrency group serializes all owners.
    - cron: '7,27,47 4-6,15-17 28-31 10 *'
    - cron: '37 6,17 28-31 10 *'
    - cron: '7,27,47 4-6,15-17 1-2 11 *'
    - cron: '37 6,17 1-2 11 *'
  workflow_dispatch:
    inputs:
      mode:
        description: Verify private prepared bundles or publish only actually due content
        type: choice
        options: [verify, verify-deployment, publish-due, catchup-carousel-2026-10-28]
        default: verify

permissions:
  contents: write
  pages: write

concurrency:
  group: reviewed-daily-film-publication
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 210
    env:
      GH_TOKEN: ${{ github.token }}
      PYTHONDONTWRITEBYTECODE: '1'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: main
          fetch-depth: 0
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: '3.13'
      - name: Test date, duplicate and bundle guards
        run: python3 -B -m unittest discover -s scripts/online_films -p 'test_*.py' -v
      - name: Rehearse all private bundles and verify Pages access
        if: github.event_name == 'workflow_dispatch' && inputs.mode == 'verify'
        run: python3 -B scripts/online_films/publish.py --verify --verify-build
      - name: Rehearse reviewed carousel galleries privately
        if: github.event_name == 'workflow_dispatch' && inputs.mode == 'verify'
        run: python3 -B scripts/online_films/publish_carousel.py --verify
      - name: Verify existing Pages deployment only
        if: github.event_name == 'workflow_dispatch' && inputs.mode == 'verify-deployment'
        run: python3 -B scripts/online_films/publish.py --verify-build
      - name: Publish only the reviewed carousel due now
        if: github.event_name == 'schedule' || inputs.mode == 'publish-due'
        run: python3 -B scripts/online_films/publish_carousel.py --wait-for-slot
      - name: Publish the exact missed carousel once under dated owner authorization
        if: github.event_name == 'workflow_dispatch' && inputs.mode == 'catchup-carousel-2026-10-28'
        run: python3 -B scripts/online_films/publish_carousel.py --owner-catchup-2026-10-28
      - name: Publish only the reviewed film due now
        if: github.event_name == 'schedule' || inputs.mode == 'publish-due'
        run: python3 -B scripts/online_films/publish.py --wait-for-slot
